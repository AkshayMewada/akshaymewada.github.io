title: Akshay Mewada
description: Software, AI, and the things I learn along the way.
url: https://akshaymewada.github.io
baseurl: ""
markdown: kramdown
highlighter: rouge
permalink: /articles/:title/
author:
  name: Akshay Mewada
  bio: Software Engineer — Automate When It Makes Sense
  location: Mumbai, India
  avatar: /assets/images/profile.jpg
plugins:
  - jekyll-feed
  - jekyll-sitemap
exclude:
  - README.md
  - LICENSE-AUDIT.md
  - DEPENDENCY-LICENSES.json
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor
  - .bundle
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
