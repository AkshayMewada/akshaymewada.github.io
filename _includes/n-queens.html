<div class="queens-game">

  <h2>♛ N-Queens Challenge</h2>

  <p class="game-description">
    Place the queens so that no two queens can attack each other.
  </p>

  <div class="level-info">
    <strong id="level-title">Level 1 — 4 × 4</strong>
    <span id="progress-text">4×4 → 8×8</span>
  </div>

  <div class="progress-bar">
    <div id="progress-fill"></div>
  </div>

  <div id="queens-board" class="queens-board"></div>

  <div class="game-info">
    <span id="queen-count">Queens: 0 / 4</span>
  </div>

  <p id="queens-message" class="queens-message">
    Place 4 queens safely.
  </p>

  <div class="game-actions">
    <button id="reset-level" class="game-button">
      Reset Level
    </button>

    <button id="restart-game" class="game-button secondary">
      Restart Challenge
    </button>
  </div>

  <div id="final-message" class="final-message hidden">

    <img
      class="avenger-gif"
      src="{{ '/assets/images/avenger.gif' | relative_url }}"
      alt="Avenger celebration"
    />

    <button id="play-again" class="game-button">
      Play Again
    </button>

  </div>

</div>

<style>

.queens-game {
  width: 100%;
  max-width: 480px;
  margin: 40px auto;
  text-align: center;
  padding: clamp(16px, 4vw, 32px);
  border: 1px solid rgba(128, 128, 128, 0.3);
  border-radius: 12px;
  overflow: hidden;
  box-sizing: border-box;
}

.queens-game,
.queens-game * {
  box-sizing: border-box;
}

.queens-game h2 {
  margin: 0 0 8px;
  font-size: clamp(21px, 5vw, 28px);
  overflow-wrap: anywhere;
}

.game-description {
  opacity: 0.75;
  margin: 0 0 25px;
}

.level-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 8px;
  font-size: 14px;
}

#progress-text {
  opacity: 0.65;
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(128, 128, 128, 0.2);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 25px;
}

#progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.4s ease;
}

.queens-board {
  display: grid;
  width: min(100%, 480px);
  max-width: 100%;
  aspect-ratio: 1 / 1;
  container-type: inline-size;
  margin: 0 auto;
  border: 2px solid #444;
  border-radius: 6px;
  overflow: hidden;
}

.queen-cell {
  min-width: 0;
  min-height: 0;
  border: none;
  padding: 0;
  margin: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: clamp(18px, 7cqw, 40px);

  cursor: pointer;

  transition:
    opacity 0.15s ease,
    transform 0.15s ease;
}

.queen-cell.light {
  background: #f0d9b5;
}

.queen-cell.dark {
  background: #b58863;
}

.queen-cell:hover {
  opacity: 0.85;
}

.queen-cell.conflict {
  background: #e57373;
}

.queen-cell.queen {
  animation: queenAppear 0.15s ease;
}

@keyframes queenAppear {
  from {
    transform: scale(0.5);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }
}

.game-info {
  margin-top: 15px;
  font-weight: 600;
}

.queens-message {
  margin: 12px 0 18px;
  min-height: 24px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.game-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

.game-button {
  max-width: 100%;
  padding: 9px 16px;
  margin: 0;

  border-radius: 7px;
  border: 1px solid #999;

  background: transparent;

  cursor: pointer;

  font-size: 14px;
  font-weight: 600;
}

.game-button:hover {
  background: rgba(128, 128, 128, 0.1);
}

.game-button.secondary {
  opacity: 0.75;
}

.final-message {
  width: 100%;
  padding: 30px 0 0;
  animation: finalAppear 0.5s ease;
}

.final-message h2 {
  font-size: 30px;
  margin-bottom: 12px;
}

.final-message p {
  line-height: 1.6;
}

.avenger-gif {
  display: block;
  width: min(100%, 420px);
  max-height: 300px;
  object-fit: contain;

  margin: 0 auto 20px;

  border-radius: 12px;
}

.hero-subtitle {
  font-weight: bold;
  margin-top: 15px;
}

.queens-game .hidden {
  display: none;
}

@keyframes finalAppear {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 450px) {

  .queens-game {
    margin: 24px auto;
    padding: 14px;
    border-radius: 10px;
  }

  .level-info {
    flex-direction: column;
    gap: 4px;
  }

  .game-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .game-button {
    width: 100%;
  }

}

</style>

<script>

(() => {

  const boardElement =
    document.getElementById("queens-board");

  const countElement =
    document.getElementById("queen-count");

  const messageElement =
    document.getElementById("queens-message");

  const levelTitle =
    document.getElementById("level-title");

  const progressFill =
    document.getElementById("progress-fill");

  const resetButton =
    document.getElementById("reset-level");

  const restartButton =
    document.getElementById("restart-game");

  const finalMessage =
    document.getElementById("final-message");

  const playAgain =
    document.getElementById("play-again");


  let size = 4;

  let queens = [];

  let transitioning = false;


  startLevel();


  function startLevel() {

    transitioning = false;

    queens = [];

    boardElement.style.display = "grid";

    countElement.style.display = "block";

    messageElement.style.display = "block";

    resetButton.style.display = "inline-block";

    restartButton.style.display = "inline-block";

    finalMessage.classList.add("hidden");


    levelTitle.textContent =
      `Level ${size - 3} — ${size} × ${size}`;


    updateProgress();


    createBoard();


    countElement.textContent =
      `Queens: 0 / ${size}`;


    messageElement.textContent =
      `Place ${size} queens safely.`;

  }


  function createBoard() {

    boardElement.innerHTML = "";


    boardElement.style.gridTemplateColumns =
      `repeat(${size}, 1fr)`;


    boardElement.style.gridTemplateRows =
      `repeat(${size}, 1fr)`;


    for (let row = 0; row < size; row++) {

      for (let col = 0; col < size; col++) {


        const cell =
          document.createElement("button");


        cell.type = "button";


        cell.className =
          "queen-cell " +
          (
            (row + col) % 2 === 0
              ? "light"
              : "dark"
          );


        cell.dataset.row = row;

        cell.dataset.col = col;


        cell.setAttribute(
          "aria-label",
          `Row ${row + 1}, Column ${col + 1}`
        );


        cell.addEventListener(
          "click",
          () => toggleQueen(row, col)
        );


        boardElement.appendChild(cell);

      }

    }

  }


  function toggleQueen(row, col) {

    if (transitioning) {
      return;
    }


    const existingIndex =
      queens.findIndex(
        q =>
          q.row === row &&
          q.col === col
      );


    if (existingIndex >= 0) {

      queens.splice(existingIndex, 1);

    }

    else {

      if (queens.length >= size) {

        messageElement.textContent =
          `Only ${size} queens are allowed.`;

        return;

      }


      queens.push({
        row,
        col
      });

    }


    updateGame();

  }


  function queensAttack(q1, q2) {

    if (q1.row === q2.row) {
      return true;
    }


    if (q1.col === q2.col) {
      return true;
    }


    return (
      Math.abs(q1.row - q2.row)
      ===
      Math.abs(q1.col - q2.col)
    );

  }


  function getConflicts() {

    const conflicts =
      new Set();


    for (
      let i = 0;
      i < queens.length;
      i++
    ) {

      for (
        let j = i + 1;
        j < queens.length;
        j++
      ) {


        if (
          queensAttack(
            queens[i],
            queens[j]
          )
        ) {


          conflicts.add(
            `${queens[i].row}-${queens[i].col}`
          );


          conflicts.add(
            `${queens[j].row}-${queens[j].col}`
          );

        }

      }

    }


    return conflicts;

  }


  function updateGame() {

    const conflicts =
      getConflicts();


    const cells =
      boardElement.querySelectorAll(
        ".queen-cell"
      );


    cells.forEach(cell => {


      const row =
        Number(cell.dataset.row);


      const col =
        Number(cell.dataset.col);


      const hasQueen =
        queens.some(
          q =>
            q.row === row &&
            q.col === col
        );


      cell.textContent =
        hasQueen ? "♛" : "";


      cell.classList.toggle(
        "queen",
        hasQueen
      );


      cell.classList.toggle(
        "conflict",
        conflicts.has(
          `${row}-${col}`
        )
      );

    });


    countElement.textContent =
      `Queens: ${queens.length} / ${size}`;


    if (
      queens.length === size &&
      conflicts.size === 0
    ) {

      levelSolved();

      return;

    }


    if (conflicts.size > 0) {

      messageElement.textContent =
        "⚔️ Careful! Some queens can attack each other.";

    }

    else {

      const remaining =
        size - queens.length;


      messageElement.textContent =
        remaining === 1
          ? "Almost there — 1 queen left!"
          : `${remaining} queens remaining.`;

    }

  }


  function levelSolved() {

    transitioning = true;


    if (size === 8) {

      messageElement.textContent =
        "🔥 8×8 conquered!";


      updateProgress(true);


      setTimeout(
        showFinalScreen,
        1000
      );


      return;

    }


    messageElement.textContent =
      `🎉 ${size}×${size} solved! Next level...`;


    updateProgress(true);


    setTimeout(() => {

      size++;

      startLevel();

    }, 1200);

  }


  function updateProgress(completed = false) {

    const totalLevels = 5;

    let completedLevels =
      size - 4;


    if (completed) {
      completedLevels++;
    }


    const progress =
      (
        completedLevels /
        totalLevels
      ) * 100;


    progressFill.style.width =
      `${Math.min(progress, 100)}%`;

  }


  function showFinalScreen() {

    progressFill.style.width =
      "100%";


    boardElement.style.display =
      "none";


    countElement.style.display =
      "none";


    messageElement.style.display =
      "none";


    resetButton.style.display =
      "none";


    restartButton.style.display =
      "none";


    levelTitle.textContent =
      "Challenge Complete";


    finalMessage.classList.remove(
      "hidden"
    );

  }


  resetButton.addEventListener(
    "click",
    () => {

      queens = [];

      transitioning = false;

      createBoard();


      countElement.textContent =
        `Queens: 0 / ${size}`;


      messageElement.textContent =
        `Place ${size} queens safely.`;

    }
  );


  function restartGame() {

    size = 4;

    queens = [];

    transitioning = false;

    startLevel();

  }


  restartButton.addEventListener(
    "click",
    restartGame
  );


  playAgain.addEventListener(
    "click",
    restartGame
  );

})();
</script>
